name: Generate Vial keymap

on:
  push:
    paths:
      - "miryoku_vial/**"
      - "pyproject.toml"
      - "config/keyboard_uid.txt"
      - ".github/workflows/generate-vil.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: pip install pytest

      - name: Run tests
        run: python3 -m pytest -q

      - name: Read target keyboard uid
        id: uid
        run: echo "value=$(tr -d '[:space:]' < config/keyboard_uid.txt)" >> "$GITHUB_OUTPUT"

      - name: Regenerate output/bad_wings_v2_miryoku.vil
        run: python3 -m miryoku_vial --uid "${{ steps.uid.outputs.value }}" -o output/bad_wings_v2_miryoku.vil

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- output/bad_wings_v2_miryoku.vil; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit regenerated file
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/bad_wings_v2_miryoku.vil
          git commit -m "Regenerate output/bad_wings_v2_miryoku.vil [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
